<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backrooms Reimagined</title>
<style>
  :root {
    --border: #bbb;
    --bg: #f4f4f0;
    --white: #fff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #3a3a3a;
    --archive: #999;
    --danger: #c0392b;
    --safe-color: #2a7a2a;
    --unsafe-color: #b34a00;
    --dead-color: #8b0000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background-color: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8c8c0' fill-opacity='0.18'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    color: var(--text);
    min-height: 100vh;
  }
  a { color: #3a3a8a; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* NAV */
  #site-nav {
    background: var(--white);
    border-bottom: 2px solid var(--border);
    padding: 0 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  #site-title { font-size: 1.1rem; font-weight: bold; padding: 0.75rem 0; letter-spacing: 0.03em; }
  #site-title span { color: var(--muted); font-weight: normal; }
  #nav-links { display: flex; gap: 1.5rem; font-size: 0.9rem; }
  #nav-links a { color: var(--text); padding: 0.75rem 0; display: block; border-bottom: 2px solid transparent; }
  #nav-links a:hover { border-bottom-color: var(--text); text-decoration: none; }

  /* LAYOUT */
  #app { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

  /* PAGE SECTIONS */
  .page { display: none; }
  .page.active { display: block; }

  /* HERO */
  #hero {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 2rem;
    margin-bottom: 1.5rem;
  }
  #hero h1 { font-size: 1.8rem; margin-bottom: 0.75rem; }
  #hero p { color: var(--muted); line-height: 1.7; font-size: 0.95rem; }
  #site-desc { margin-top: 0.5rem; }

  /* INDEX */
  .category-block { margin-bottom: 1rem; border: 1px solid var(--border); background: var(--white); }
  .category-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 1rem; cursor: pointer;
    background: #f0f0ec; border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .category-header:hover { background: #e8e8e4; }
  .category-header h2 { font-size: 1rem; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; }
  .chevron { font-size: 0.75rem; transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }
  .category-body { display: none; }
  .category-body.open { display: block; }

  .sub-block { border-bottom: 1px solid #e0e0d8; }
  .sub-block:last-child { border-bottom: none; }
  .sub-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 1rem 0.5rem 1.5rem; cursor: pointer;
    background: #fafaf8;
  }
  .sub-header:hover { background: #f0f0ec; }
  .sub-header span { font-size: 0.85rem; color: var(--muted); font-style: italic; }
  .sub-body { display: none; padding: 0.25rem 0; }
  .sub-body.open { display: block; }

  .entry-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.45rem 1rem 0.45rem 2.5rem;
    border-bottom: 1px solid #efefeb;
    font-size: 0.9rem;
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row a { color: var(--text); }
  .entry-row a:hover { color: #3a3a8a; text-decoration: underline; }
  .entry-archived { color: var(--archive); font-style: italic; pointer-events: none; }
  .badge {
    font-size: 0.7rem; padding: 0.1rem 0.45rem; border: 1px solid;
    border-radius: 2px; font-family: monospace; text-transform: uppercase; margin-left: 0.5rem;
  }
  .badge-safe { color: var(--safe-color); border-color: var(--safe-color); }
  .badge-unsafe { color: var(--unsafe-color); border-color: var(--unsafe-color); }
  .badge-deadzone { color: var(--dead-color); border-color: var(--dead-color); }
  .badge-neutral { color: var(--muted); border-color: var(--muted); }

  /* ENTRY PAGE */
  #entry-page { background: var(--white); border: 1px solid var(--border); padding: 2rem; }
  #entry-page .entry-title { font-size: 2rem; margin-bottom: 0.25rem; }
  #entry-page .entry-meta { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  #entry-page .entry-meta .badge { font-size: 0.75rem; padding: 0.15rem 0.5rem; }
  #entry-page .entry-cat { font-size: 0.8rem; color: var(--muted); font-family: monospace; text-transform: uppercase; }
  .entry-img { width: 100%; max-height: 350px; object-fit: cover; border: 1px solid var(--border); margin-bottom: 1.5rem; display: block; }
  .entry-body { line-height: 1.8; font-size: 0.95rem; white-space: pre-wrap; }
  .entry-fields { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .entry-field { display: flex; gap: 1rem; padding: 0.4rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  .entry-field:last-child { border-bottom: none; }
  .field-key { font-weight: bold; min-width: 140px; color: var(--accent); }
  .field-val { color: var(--text); flex: 1; }
  .back-btn { margin-bottom: 1.5rem; font-size: 0.85rem; cursor: pointer; color: #3a3a8a; background: none; border: none; padding: 0; }
  .back-btn:hover { text-decoration: underline; }
  .archived-banner { background: #fff3cd; border: 1px solid #e0c060; padding: 0.6rem 1rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: #7a6000; }

  /* ABOUT */
  #about-page { background: var(--white); border: 1px solid var(--border); padding: 2rem; line-height: 1.8; }
  #about-page h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  #about-body { font-size: 0.95rem; white-space: pre-wrap; }

  /* ADMIN */
  #admin-page { background: var(--white); border: 1px solid var(--border); padding: 2rem; }
  #admin-login { max-width: 340px; margin: 3rem auto; text-align: center; }
  #admin-login h2 { margin-bottom: 1.5rem; font-size: 1.3rem; }
  .input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); font-size: 0.9rem; font-family: inherit; margin-bottom: 0.75rem; background: var(--bg); }
  .btn { padding: 0.55rem 1.25rem; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #555; }
  .btn-outline { background: none; color: var(--accent); }
  .btn-outline:hover { background: var(--accent); color: #fff; }
  .btn-danger { border-color: var(--danger); background: var(--danger); }
  .btn-danger:hover { background: #a93226; }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; }

  #admin-panel h2 { font-size: 1.3rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
  .admin-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); }
  .admin-tab { padding: 0.5rem 1.25rem; font-size: 0.85rem; cursor: pointer; background: none; border: none; font-family: inherit; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .admin-tab.active { color: var(--text); font-weight: bold; border-bottom-color: var(--text); }
  .admin-tab-content { display: none; }
  .admin-tab-content.active { display: block; }

  .admin-entry-list { margin-top: 1rem; }
  .admin-entry-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 0.75rem; border: 1px solid var(--border); margin-bottom: 0.4rem;
    background: var(--bg); font-size: 0.88rem;
  }
  .admin-entry-row.archived { opacity: 0.55; }
  .admin-entry-info { flex: 1; }
  .admin-entry-name { font-weight: bold; }
  .admin-entry-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
  .three-dot-wrap { position: relative; }
  .three-dot-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.2rem 0.5rem; color: var(--muted); line-height: 1; }
  .three-dot-btn:hover { color: var(--text); }
  .dropdown {
    display: none; position: absolute; right: 0; top: 100%; background: var(--white);
    border: 1px solid var(--border); min-width: 160px; z-index: 200; box-shadow: 2px 2px 8px rgba(0,0,0,0.08);
  }
  .dropdown.open { display: block; }
  .dropdown-item { padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; display: block; width: 100%; text-align: left; background: none; border: none; font-family: inherit; }
  .dropdown-item:hover { background: #f0f0ec; }
  .dropdown-item.danger { color: var(--danger); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border: 1px solid var(--border); width: 100%; max-width: 600px; padding: 2rem; margin: auto; }
  .modal h3 { margin-bottom: 1.5rem; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
  .form-row { margin-bottom: 1rem; }
  .form-row label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 0.35rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.03em; }
  .form-row select, .form-row input, .form-row textarea { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border); font-size: 0.9rem; font-family: inherit; background: var(--bg); }
  .form-row textarea { resize: vertical; min-height: 100px; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
  .custom-fields { margin-top: 0.5rem; }
  .custom-field-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
  .custom-field-row input { flex: 1; }
  .remove-field-btn { background: none; border: 1px solid var(--border); cursor: pointer; padding: 0 0.5rem; color: var(--muted); font-size: 0.85rem; }
  .add-field-btn { font-size: 0.8rem; color: #3a3a8a; background: none; border: none; cursor: pointer; padding: 0; margin-top: 0.25rem; }
  .add-field-btn:hover { text-decoration: underline; }

  .confirm-modal { max-width: 380px; text-align: center; }
  .confirm-modal p { margin-bottom: 1.5rem; color: var(--muted); font-size: 0.9rem; }

  /* SETTINGS */
  .settings-section { margin-bottom: 2rem; }
  .settings-section h3 { font-size: 0.95rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
  .logout-row { margin-top: 2rem; }

  /* SEARCH */
  #search-bar { width: 100%; padding: 0.65rem 1rem; border: 1px solid var(--border); font-size: 0.95rem; font-family: inherit; background: var(--white); margin-bottom: 1.5rem; }
  .no-results { color: var(--muted); font-style: italic; font-size: 0.9rem; padding: 1rem 0; }

  @media(max-width:600px) {
    #app { padding: 1rem 0.5rem; }
    #entry-page, #about-page, #admin-page { padding: 1.25rem; }
    .field-key { min-width: 100px; }
  }
</style>
</head>
<body>

<nav id="site-nav">
  <div id="site-title">BACKROOMS REIMAGINED <span>/ Field Guide</span></div>
  <div id="nav-links">
    <a href="#" onclick="showPage('home');return false;">Home</a>
    <a href="#" onclick="showPage('index');return false;">Index</a>
    <a href="#" onclick="showPage('about');return false;">About</a>
  </div>
</nav>

<div id="app">

  <!-- HOME -->
  <div id="page-home" class="page active">
    <div id="hero">
      <h1 id="site-name-display">The Backrooms</h1>
      <p id="site-desc-display">Loading...</p>
    </div>
    <div id="home-index"></div>
  </div>

  <!-- INDEX -->
  <div id="page-index" class="page">
    <input id="search-bar" type="text" placeholder="Search entries…" oninput="renderSearch(this.value)">
    <div id="search-results" style="display:none"></div>
    <div id="full-index"></div>
  </div>

  <!-- ABOUT -->
  <div id="page-about" class="page">
    <div id="about-page">
      <h1>About</h1>
      <div id="about-body"></div>
    </div>
  </div>

  <!-- ENTRY -->
  <div id="page-entry" class="page">
    <div id="entry-page">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <div id="entry-content"></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div id="page-admin" class="page">
    <div id="admin-login">
      <h2>Admin Access</h2>
      <input class="input" type="password" id="admin-pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
      <br>
      <button class="btn" onclick="doLogin()">Enter</button>
      <div class="error-msg" id="login-err"></div>
    </div>
    <div id="admin-panel" style="display:none">
      <h2>Admin Panel</h2>
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchAdminTab('entries',this)">Entries</button>
        <button class="admin-tab" onclick="switchAdminTab('settings',this)">Site Settings</button>
      </div>

      <!-- ENTRIES TAB -->
      <div id="admin-tab-entries" class="admin-tab-content active">
        <button class="btn" onclick="openAddModal()">+ Add Entry</button>
        <div class="admin-entry-list" id="admin-entry-list"></div>
      </div>

      <!-- SETTINGS TAB -->
      <div id="admin-tab-settings" class="admin-tab-content">
        <div class="settings-section">
          <h3>Site Identity</h3>
          <div class="form-row"><label>Site Name</label><input class="input" id="set-name" type="text"></div>
          <div class="form-row"><label>Site Description</label><textarea class="input" id="set-desc" rows="3"></textarea></div>
        </div>
        <div class="settings-section">
          <h3>About Page</h3>
          <div class="form-row"><label>About Content</label><textarea class="input" id="set-about" rows="6"></textarea></div>
        </div>
        <div class="settings-section">
          <h3>Admin Password</h3>
          <div class="form-row"><label>New Password</label><input class="input" id="set-pw" type="password" placeholder="Leave blank to keep current"></div>
        </div>
        <button class="btn" onclick="saveSettings()">Save Settings</button>
        <div class="logout-row"><button class="btn btn-outline btn-sm" onclick="doLogout()">Log Out</button></div>
      </div>
    </div>
  </div>

</div>

<!-- ENTRY MODAL -->
<div class="modal-overlay" id="entry-modal">
  <div class="modal">
    <h3 id="modal-title">Add Entry</h3>
    <div class="form-row">
      <label>Category</label>
      <select id="f-cat">
        <option value="levels">Level</option>
        <option value="entities">Entity</option>
        <option value="items">Item</option>
        <option value="logs">Log</option>
      </select>
    </div>
    <div class="form-row"><label>Title</label><input class="input" id="f-title" type="text" placeholder="e.g. Level 0 — The Lobby"></div>
    <div class="form-row">
      <label>Classification / Badge</label>
      <select id="f-badge">
        <option value="">None</option>
        <option value="safe">Safe</option>
        <option value="unsafe">Unsafe</option>
        <option value="deadzone">Deadzone</option>
        <option value="neutral">Neutral</option>
      </select>
    </div>
    <div class="form-row"><label>Image URL (optional)</label><input class="input" id="f-img" type="text" placeholder="https://…"></div>
    <div class="form-row"><label>Description</label><textarea id="f-desc" rows="5" placeholder="Full description of this entry…"></textarea></div>
    <div class="form-row">
      <label>Additional Fields (optional)</label>
      <div class="custom-fields" id="custom-fields"></div>
      <button class="add-field-btn" onclick="addCustomField('','')">+ Add field</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('entry-modal')">Cancel</button>
      <button class="btn" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal confirm-modal">
    <h3 id="confirm-title">Confirm Delete</h3>
    <p id="confirm-msg">Are you sure? This cannot be undone.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const ADMIN_PATH = 'admin';
let currentPage = 'home';
let prevPage = 'home';
let currentEntry = null;
let editingId = null;
let openDropdown = null;

  const DEFAULT_DATA = {
  settings: {
    siteName: 'Backrooms Reimagined',
    siteDesc: 'A comprehensive field guide to the Backrooms — documenting levels, entities, items, and survivor logs for those who have no-clipped from reality.',
    about: 'This wiki serves as a collaborative field guide to the Backrooms. Information is compiled from survivor accounts, expedition logs, and first-hand documentation.\n\nContribute responsibly. Accuracy may save lives.',
    password: 'admin123'
  },
  entries: [
    {
      id: 'lvl0', cat: 'levels', title: 'Level 0 — The Lobby', badge: 'safe', archived: false,
      img: '', order: 0,
      desc: 'Level 0 is the first and most well-known level of the Backrooms. It resembles an endless series of office rooms and hallways, characterised by yellow, mono-coloured, damp carpet, yellow wallpaper, and fluorescent lighting.\n\nNo windows or doors are present, and the space appears to be infinite. The hum of fluorescent lights is a constant presence.',
      fields: [
        { key: 'Danger Rating', val: 'Low' },
        { key: 'Entities Present', val: 'None confirmed' },
        { key: 'Entrances', val: 'No-clipping through reality in the right circumstances' },
        { key: 'Exits', val: 'No-clipping through a wall leads to Level 1' }
      ]
    },
    {
      id: 'lvl1', cat: 'levels', title: 'Level 1 — Habitable Zone', badge: 'unsafe', archived: false,
      img: '', order: 1,
      desc: 'Level 1 is a large, sprawling warehouse. Crates and machinery are scattered throughout. Unlike Level 0, water and sustenance can occasionally be found here, making it a crucial early waypoint for survivors.',
      fields: [
        { key: 'Danger Rating', val: 'Moderate' },
        { key: 'Entities Present', val: 'Smilers, Hounds' },
        { key: 'Entrances', val: 'No-clipping in Level 0' },
        { key: 'Exits', val: 'Various — leads to Levels 2, 3, and 4' }
      ]
    },
    {
      id: 'ent1', cat: 'entities', title: 'Smilers', badge: 'unsafe', archived: false,
      img: '', order: 0,
      desc: 'Smilers are entities that lurk in darkness, identifiable only by the two crescent-shaped patches of light that form a grin. They appear motionless when directly observed, but move rapidly in peripheral vision or darkness.',
      fields: [
        { key: 'Threat Level', val: 'High' },
        { key: 'Behaviour', val: 'Stalking, ambush' },
        { key: 'Countermeasures', val: 'Maintain light at all times. Never look away.' }
      ]
    },
    {
      id: 'itm1', cat: 'items', title: 'Almond Water', badge: 'safe', archived: false,
      img: '', order: 0,
      desc: 'Almond Water is a pale, slightly sweet liquid found throughout the Backrooms. It sustains wanderers and is believed to have mild sanity-preserving properties. Its origin is unknown.',
      fields: [
        { key: 'Found In', val: 'Levels 0, 1, 3' },
        { key: 'Effect', val: 'Hydration, mild stabilisation' }
      ]
    }
  ]
};

function loadData() {
  try {
    const raw = localStorage.getItem('bw_data');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(d) {
  try { localStorage.setItem('bw_data', JSON.stringify(d)); } catch(e) {}
}
let DB = loadData();

// ─── ROUTING ─────────────────────────────────────────────────────────────────
function showPage(name, data) {
  if (name !== 'entry') prevPage = currentPage;
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const pg = document.getElementById('page-' + name);
  if (pg) pg.classList.add('active');
  if (name === 'home') renderHome();
  if (name === 'index') renderIndex();
  if (name === 'about') renderAbout();
  if (name === 'entry' && data) renderEntry(data);
  if (name === 'admin') initAdmin();
  window.scrollTo(0, 0);
  closeAllDropdowns();
}

function goBack() { showPage(prevPage); }

// Handle /admin URL
function checkRoute() {
  if (location.hash === '#/admin') showPage('admin');
}
window.addEventListener('hashchange', () => { if (location.hash === '#/admin') showPage('admin'); });

// ─── RENDER HOME ─────────────────────────────────────────────────────────────
function renderHome() {
  document.getElementById('site-name-display').textContent = DB.settings.siteName;
  document.getElementById('site-desc-display').textContent = DB.settings.siteDesc;
  document.getElementById('home-index').innerHTML = buildIndexHTML(true);
  attachIndexEvents('home-index');
}

// ─── RENDER INDEX ────────────────────────────────────────────────────────────
function renderIndex() {
  document.getElementById('search-bar').value = '';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('full-index').style.display = 'block';
  document.getElementById('full-index').innerHTML = buildIndexHTML(false);
  attachIndexEvents('full-index');
}

const CATS = [
  { key: 'levels', label: 'Levels' },
  { key: 'entities', label: 'Entities' },
  { key: 'items', label: 'Items' },
  { key: 'logs', label: 'Logs' }
];

function getPublicEntries() {
  return DB.entries;
}

function buildIndexHTML(homeMode) {
  let html = '';
  CATS.forEach(cat => {
    const entries = DB.entries.filter(e => e.cat === cat.key);
    if (entries.length === 0) return;

    if (cat.key === 'levels') {
      // Group into 0-99, 100-199 etc
      const numbered = entries.filter(e => {
        const m = e.title.match(/Level\s+(\d+)/i);
        return m !== null;
      }).sort((a,b) => {
        const na = parseInt(a.title.match(/Level\s+(\d+)/i)?.[1]||9999);
        const nb = parseInt(b.title.match(/Level\s+(\d+)/i)?.[1]||9999);
        return na - nb;
      });
      const unnumbered = entries.filter(e => !e.title.match(/Level\s+(\d+)/i));

      // Build groups
      const groups = {};
      numbered.forEach(e => {
        const n = parseInt(e.title.match(/Level\s+(\d+)/i)[1]);
        const g = Math.floor(n/100)*100;
        const key = `${g}–${g+99}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(e);
      });
      if (unnumbered.length) groups['Other'] = unnumbered;

      html += `<div class="category-block">
        <div class="category-header" onclick="toggleCat(this)">
          <h2>Levels</h2><span class="chevron">▼</span>
        </div>
        <div class="category-body open">`;
      Object.entries(groups).forEach(([label, grpEntries]) => {
        html += `<div class="sub-block">
          <div class="sub-header" onclick="toggleSub(this)">
            <span style="font-size:0.85rem;font-weight:bold">Levels ${label}</span>
            <span>${grpEntries.length} entries</span>
          </div>
          <div class="sub-body open">`;
        grpEntries.forEach(e => { html += entryRowHTML(e); });
        html += `</div></div>`;
      });
      html += `</div></div>`;
    } else {
      html += `<div class="category-block">
        <div class="category-header" onclick="toggleCat(this)">
          <h2>${cat.label}</h2><span class="chevron">▼</span>
        </div>
        <div class="category-body open">
          <div class="sub-body open" style="display:block">`;
      entries.forEach(e => { html += entryRowHTML(e); });
      html += `</div></div></div>`;
    }
  });
  return html || '<p class="no-results">No entries yet.</p>';
}

function entryRowHTML(e) {
  const archived = e.archived;
  const label = archived ? `<span class="entry-archived">[TEMPORARILY ARCHIVED] ${e.title}</span>` : `<a href="#" onclick="openEntry('${e.id}');return false;">${e.title}</a>`;
  const badge = e.badge ? `<span class="badge badge-${e.badge}">${e.badge}</span>` : '';
  return `<div class="entry-row">${label}${badge}</div>`;
}

function toggleCat(el) {
  el.querySelector('.chevron').classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}
function toggleSub(el) {
  el.nextElementSibling.classList.toggle('open');
}
function attachIndexEvents() {}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function renderSearch(q) {
  const sr = document.getElementById('search-results');
  const fi = document.getElementById('full-index');
  if (!q.trim()) { sr.style.display='none'; fi.style.display='block'; return; }
  fi.style.display = 'none'; sr.style.display = 'block';
  const lower = q.toLowerCase();
  const results = DB.entries.filter(e => !e.archived && (
    e.title.toLowerCase().includes(lower) ||
    (e.desc||'').toLowerCase().includes(lower) ||
    (e.fields||[]).some(f => f.val.toLowerCase().includes(lower))
  ));
  if (!results.length) { sr.innerHTML = '<p class="no-results">No results found.</p>'; return; }
  sr.innerHTML = results.map(e => entryRowHTML(e)).join('');
}

// ─── RENDER ENTRY ────────────────────────────────────────────────────────────
function openEntry(id) {
  const e = DB.entries.find(x => x.id === id);
  if (!e || e.archived) return;
  showPage('entry', e);
}

function renderEntry(e) {
  currentEntry = e;
  let html = '';
  if (e.archived) html += `<div class="archived-banner">⚠ This entry is temporarily archived and may be under revision.</div>`;
  html += `<div class="entry-meta"><span class="entry-cat">${e.cat}</span>${e.badge ? `<span class="badge badge-${e.badge}">${e.badge}</span>` : ''}</div>`;
  html += `<h1 class="entry-title">${e.title}</h1>`;
  if (e.img) html += `<img class="entry-img" src="${e.img}" alt="${e.title}" onerror="this.style.display='none'">`;
  if (e.desc) html += `<div class="entry-body">${escHtml(e.desc)}</div>`;
  if (e.fields && e.fields.length) {
    html += `<div class="entry-fields">`;
    e.fields.forEach(f => {
      html += `<div class="entry-field"><div class="field-key">${escHtml(f.key)}</div><div class="field-val">${escHtml(f.val)}</div></div>`;
    });
    html += `</div>`;
  }
  document.getElementById('entry-content').innerHTML = html;
}

// ─── RENDER ABOUT ────────────────────────────────────────────────────────────
function renderAbout() {
  document.getElementById('about-body').textContent = DB.settings.about;
}

// ─── ADMIN AUTH ──────────────────────────────────────────────────────────────
let adminAuthed = false;
function doLogin() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === DB.settings.password) {
    adminAuthed = true;
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    renderAdminEntries();
    loadSettingsForm();
  } else {
    document.getElementById('login-err').textContent = 'Incorrect password.';
  }
}
function doLogout() {
  adminAuthed = false;
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('admin-login').style.display = 'block';
  document.getElementById('admin-pw').value = '';
  document.getElementById('login-err').textContent = '';
}
function initAdmin() {
  if (adminAuthed) {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    renderAdminEntries();
    loadSettingsForm();
  } else {
    document.getElementById('admin-login').style.display = 'block';
    document.getElementById('admin-panel').style.display = 'none';
  }
}

// ─── ADMIN TABS ──────────────────────────────────────────────────────────────
function switchAdminTab(name, el) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('admin-tab-' + name).classList.add('active');
}

// ─── ADMIN ENTRIES ───────────────────────────────────────────────────────────
function renderAdminEntries() {
  const list = document.getElementById('admin-entry-list');
  if (!DB.entries.length) { list.innerHTML = '<p class="no-results" style="padding:1rem 0">No entries yet.</p>'; return; }
  list.innerHTML = DB.entries.map(e => `
    <div class="admin-entry-row ${e.archived?'archived':''}" id="arow-${e.id}">
      <div class="admin-entry-info">
        <div class="admin-entry-name">${e.archived?'[ARCHIVED] ':''}${escHtml(e.title)}</div>
        <div class="admin-entry-sub">${e.cat}${e.badge?' · '+e.badge:''}</div>
      </div>
      <div class="three-dot-wrap">
        <button class="three-dot-btn" onclick="toggleDropdown('dd-${e.id}',event)">⋮</button>
        <div class="dropdown" id="dd-${e.id}">
          <button class="dropdown-item" onclick="openEditModal('${e.id}')">✏️ Edit</button>
          <button class="dropdown-item" onclick="toggleArchive('${e.id}')">${e.archived?'📤 Unarchive':'📦 Archive'}</button>
          <button class="dropdown-item danger" onclick="confirmDelete('${e.id}')">🗑️ Delete</button>
        </div>
      </div>
    </div>`).join('');
}

function toggleDropdown(id, e) {
  e.stopPropagation();
  const dd = document.getElementById(id);
  const wasOpen = dd.classList.contains('open');
  closeAllDropdowns();
  if (!wasOpen) { dd.classList.add('open'); openDropdown = dd; }
}
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  openDropdown = null;
}
document.addEventListener('click', closeAllDropdowns);

function toggleArchive(id) {
  const e = DB.entries.find(x => x.id === id);
  if (e) { e.archived = !e.archived; saveData(DB); renderAdminEntries(); closeAllDropdowns(); }
}

function confirmDelete(id) {
  closeAllDropdowns();
  const e = DB.entries.find(x => x.id === id);
  document.getElementById('confirm-msg').textContent = `Delete "${e.title}"? This cannot be undone.`;
  document.getElementById('confirm-ok').onclick = () => { doDelete(id); closeModal('confirm-modal'); };
  openModal('confirm-modal');
}
function doDelete(id) {
  DB.entries = DB.entries.filter(e => e.id !== id);
  saveData(DB); renderAdminEntries();
}

// ─── ENTRY MODAL ─────────────────────────────────────────────────────────────
function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Entry';
  document.getElementById('f-cat').value = 'levels';
  document.getElementById('f-title').value = '';
  document.getElementById('f-badge').value = '';
  document.getElementById('f-img').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('custom-fields').innerHTML = '';
  openModal('entry-modal');
}

function openEditModal(id) {
  closeAllDropdowns();
  const e = DB.entries.find(x => x.id === id);
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Entry';
  document.getElementById('f-cat').value = e.cat;
  document.getElementById('f-title').value = e.title;
  document.getElementById('f-badge').value = e.badge||'';
  document.getElementById('f-img').value = e.img||'';
  document.getElementById('f-desc').value = e.desc||'';
  document.getElementById('custom-fields').innerHTML = '';
  (e.fields||[]).forEach(f => addCustomField(f.key, f.val));
  openModal('entry-modal');
}

function addCustomField(k='', v='') {
  const cf = document.getElementById('custom-fields');
  const row = document.createElement('div');
  row.className = 'custom-field-row';
  row.innerHTML = `<input type="text" placeholder="Field name" value="${escHtml(k)}" style="flex:1;padding:0.45rem 0.6rem;border:1px solid var(--border);font-family:inherit;font-size:0.85rem;background:var(--bg)">
    <input type="text" placeholder="Value" value="${escHtml(v)}" style="flex:2;padding:0.45rem 0.6rem;border:1px solid var(--border);font-family:inherit;font-size:0.85rem;background:var(--bg)">
    <button class="remove-field-btn" onclick="this.parentElement.remove()">✕</button>`;
  cf.appendChild(row);
}

function saveEntry() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Title is required.'); return; }
  const fields = [];
  document.querySelectorAll('#custom-fields .custom-field-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    const k = inputs[0].value.trim(), v = inputs[1].value.trim();
    if (k) fields.push({ key: k, val: v });
  });
  if (editingId) {
    const e = DB.entries.find(x => x.id === editingId);
    e.cat = document.getElementById('f-cat').value;
    e.title = title;
    e.badge = document.getElementById('f-badge').value;
    e.img = document.getElementById('f-img').value.trim();
    e.desc = document.getElementById('f-desc').value;
    e.fields = fields;
  } else {
    DB.entries.push({
      id: 'e_' + Date.now(),
      cat: document.getElementById('f-cat').value,
      title, badge: document.getElementById('f-badge').value,
      img: document.getElementById('f-img').value.trim(),
      desc: document.getElementById('f-desc').value,
      fields, archived: false, order: DB.entries.length
    });
  }
  saveData(DB); closeModal('entry-modal'); renderAdminEntries();
}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function loadSettingsForm() {
  document.getElementById('set-name').value = DB.settings.siteName;
  document.getElementById('set-desc').value = DB.settings.siteDesc;
  document.getElementById('set-about').value = DB.settings.about;
  document.getElementById('set-pw').value = '';
}
function saveSettings() {
  DB.settings.siteName = document.getElementById('set-name').value.trim() || DB.settings.siteName;
  DB.settings.siteDesc = document.getElementById('set-desc').value.trim();
  DB.settings.about = document.getElementById('set-about').value;
  const newPw = document.getElementById('set-pw').value;
  if (newPw) DB.settings.password = newPw;
  saveData(DB);
  alert('Settings saved.');
  loadSettingsForm();
}

// ─── MODAL HELPERS ───────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ─── UTILS ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genId() { return 'e_' + Math.random().toString(36).substr(2,9); }

// ─── INIT ────────────────────────────────────────────────────────────────────
renderHome();
checkRoute();
</script>
